sentence=The Arduino library for controlling I2C LCD displays (16x2, 20x4) with helper functions, custom characters, and multiple I2C bus support. Compatible with Arduino, ESP32, ESP8266, STM32, Raspberry Pi Pico, and more.
paragraph=This library is designed for HD44780-based I2C LCD displays. It provides LiquidCrystal-compatible API plus helper functions (text alignment, progress bars, predefined custom characters). Supports multiple I2C buses (Wire, Wire1, Wire2) for advanced boards like Arduino Giga, Due, and ESP32. Compatible with all Arduino-based platforms including Arduino Uno, Mega, Nano, ESP32, ESP8266, STM32, and Raspberry Pi Pico.
